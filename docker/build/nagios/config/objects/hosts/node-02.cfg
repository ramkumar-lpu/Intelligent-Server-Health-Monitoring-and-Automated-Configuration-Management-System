###############################################################################
# HOST DEFINITION: node-02.infra.internal (Nginx Web Server)
###############################################################################

define host {
    use                     linux-server
    host_name               node-02
    alias                   node-02.infra.internal
    address                 10.240.0.102
    max_check_attempts      5
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

###############################################################################
# SERVICE DEFINITIONS FOR node-02
###############################################################################

# 1. ICMP Ping check
define service {
    use                     generic-service
    host_name               node-02
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

# 2. OpenSSH daemon check (Active TCP check)
define service {
    use                     generic-service
    host_name               node-02
    service_description     SSH
    check_command           check_ssh
    notifications_enabled   1
}


# 4. Memory Usage (via NRPE cgroup-aware check_mem_cgroup)
define service {
    use                     generic-service
    host_name               node-02
    service_description     Memory Usage
    check_command           check_nrpe_mem_cgroup
}

# 5. Root Disk Space (via NRPE check_disk)
define service {
    use                     generic-service
    host_name               node-02
    service_description     Root Partition
    check_command           check_nrpe!check_disk
}

# 6. Current Logged-in Users (via NRPE check_users)
define service {
    use                     generic-service
    host_name               node-02
    service_description     Current Users
    check_command           check_nrpe!check_users
}

# 7. Total Running Processes (via NRPE check_total_procs)
define service {
    use                     generic-service
    host_name               node-02
    service_description     Total Processes
    check_command           check_nrpe!check_total_procs
}

# 8. Container CPU Utilization & Throttling (via NRPE cgroup-aware check_cpu_cgroup)
define service {
    use                     generic-service
    host_name               node-02
    service_description     Container CPU - Cgroup
    check_command           check_nrpe_cpu_cgroup
}
