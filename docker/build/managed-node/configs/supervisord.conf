[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd_err.log

[program:nrpe]
command=/usr/sbin/nrpe -c /etc/nagios/nrpe.cfg -f
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/nrpe.log
stderr_logfile=/var/log/supervisor/nrpe_err.log

[program:puppet-agent]
# Autostart disabled in Phase 1: Activated in Phase 2 once Puppet Server CA is operational
command=/opt/puppetlabs/bin/puppet agent --no-daemonize --verbose
autostart=false
autorestart=false
priority=30
stdout_logfile=/var/log/supervisor/puppet.log
stderr_logfile=/var/log/supervisor/puppet_err.log
