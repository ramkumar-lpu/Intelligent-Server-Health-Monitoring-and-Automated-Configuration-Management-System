# Nagios Remote Plugin Executor (NRPE) Configuration for Managed Nodes
log_facility=daemon
pid_file=/run/nagios/nrpe.pid
server_port=5666
nrpe_user=nagios
nrpe_group=nagios

# Security: In Phase 1, restrict strictly to local loopback (extended in Phase 3)
allowed_hosts=127.0.0.1,::1

# Security: Disallow passing arbitrary command line arguments from remote clients
dont_blame_nrpe=0
allow_bash_command_substitution=0

command_timeout=60
connection_timeout=300

# Standard Health Check Commands (Using Monitoring Plugins)
command[check_users]=/usr/lib/nagios/plugins/check_users -w 5 -c 10
command[check_load]=/usr/lib/nagios/plugins/check_load -r -w .15,.10,.05 -c .30,.25,.20
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_zombie_procs]=/usr/lib/nagios/plugins/check_procs -w 5 -c 10 -s Z
command[check_total_procs]=/usr/lib/nagios/plugins/check_procs -w 250 -c 400
command[check_mem]=/usr/lib/nagios/plugins/check_mem -w 80 -c 90
