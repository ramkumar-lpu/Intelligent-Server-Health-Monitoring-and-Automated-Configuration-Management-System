# Master Puppet Server Configuration
[main]
certname = puppet.infra.internal
server = puppet.infra.internal
environment = production
runinterval = 30m

[server]
ca = true
dns_alt_names = puppet,puppet.infra.internal
autosign = false
ssl_client_header = HTTP_X_CLIENT_DN
ssl_client_verify_header = HTTP_X_CLIENT_VERIFY
